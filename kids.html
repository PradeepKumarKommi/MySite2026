<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Tap Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #7f5bff, #ff5da2, #ff9a3c, #4fd1ff, #7f5bff);
    background-size: 500% 500%;
    animation: candyShift 14s ease infinite;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  @keyframes candyShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* twinkling background stars */
  .twinkle {
    position: absolute;
    color: #fff;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50%      { opacity: 0.9;  transform: scale(1.15); }
  }

  /* ambient balloons/bubbles drifting up on their own */
  .ambient {
    position: absolute;
    bottom: -15%;
    pointer-events: none;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.95; }
    92%  { opacity: 0.85; }
    100% { transform: translateY(-125vh) translateX(30px) rotate(15deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8em, 9vw, 3.2em);
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffe680, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
    animation: bob 2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-8px) rotate(1deg); }
  }

  p.hint {
    margin: 0;
    color: #fff;
    font-size: clamp(1em, 4vw, 1.3em);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    animation: pulseText 1.6s ease-in-out infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  .tap-ripple {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 4px solid #fff;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 5;
    animation: ripple 0.7s ease-out forwards;
  }

  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(14); opacity: 0; }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    will-change: transform, opacity;
  }

  .confetti {
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }

  .emoji-pop {
    font-size: 2.4em;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  .star-bit {
    font-size: 1.6em;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  }

  #soundToggle {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 1.3em;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    touch-action: manipulation;
  }
</style>
</head>
<body data-page="kids">

<div class="sky" id="sky"></div>

<button id="soundToggle" aria-label="Toggle sound">🔊</button>

<div class="stage">
  <h1>Tap Anywhere for Magic! 🌈✨</h1>
  <p class="hint">Go on... poke the screen! 👆</p>
</div>

<script src="script.js"></script>

</body>
</html>
