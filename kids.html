<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Tap Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #7f5bff, #ff5da2, #ff9a3c, #4fd1ff, #7f5bff);
    background-size: 500% 500%;
    animation: candyShift 14s ease infinite;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  @keyframes candyShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* twinkling background stars */
  .twinkle {
    position: absolute;
    color: #fff;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50%      { opacity: 0.9;  transform: scale(1.15); }
  }

  /* ambient balloons/bubbles drifting up on their own */
  .ambient {
    position: absolute;
    bottom: -15%;
    pointer-events: none;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.95; }
    92%  { opacity: 0.85; }
    100% { transform: translateY(-125vh) translateX(30px) rotate(15deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8em, 9vw, 3.2em);
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffe680, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
    animation: bob 2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-8px) rotate(1deg); }
  }

  p.hint {
    margin: 0;
    color: #fff;
    font-size: clamp(1em, 4vw, 1.3em);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    animation: pulseText 1.6s ease-in-out infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  .tap-ripple {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 4px solid #fff;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 5;
    animation: ripple 0.7s ease-out forwards;
  }

  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(14); opacity: 0; }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    will-change: transform, opacity;
  }

  .confetti {
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }

  .emoji-pop {
    font-size: 2.4em;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  .star-bit {
    font-size: 1.6em;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  }

  #soundToggle {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 1.3em;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    touch-action: manipulation;
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<button id="soundToggle" aria-label="Toggle sound">🔊</button>

<div class="stage">
  <h1>Tap Anywhere for Magic! 🌈✨</h1>
  <p class="hint">Go on... poke the screen! 👆</p>
</div>

<script>
  const sky = document.getElementById('sky');

  const EMOJIS = ['🎈','🦄','🌈','🍭','🎉','🐶','🐱','🦋','🍦','⭐','🐬','🍩','🚀','🌸','🐢'];
  const CONFETTI_COLORS = ['#ff5da2', '#ffd93d', '#4fd1ff', '#7f5bff', '#ff9a3c', '#6bff8c'];

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- Ambient background life (plays on its own, no tap needed) ----------

  function spawnTwinkle() {
    const t = document.createElement('div');
    t.className = 'twinkle';
    t.textContent = choice(['✨','⭐','💫']);
    t.style.left = rand(0, 100) + 'vw';
    t.style.top = rand(0, 90) + 'vh';
    t.style.fontSize = rand(0.7, 1.6) + 'em';
    t.style.animationDuration = rand(1.6, 3.2) + 's';
    sky.appendChild(t);
    setTimeout(() => t.remove(), 6000);
  }

  function spawnAmbient() {
    const a = document.createElement('div');
    a.className = 'ambient';
    a.textContent = choice(['🎈','☁️','⭐','🍬','🦋']);
    a.style.left = rand(0, 96) + 'vw';
    a.style.fontSize = rand(1.2, 2.6) + 'em';
    a.style.animationDuration = rand(9, 16) + 's';
    sky.appendChild(a);
    setTimeout(() => a.remove(), 18000);
  }

  setInterval(spawnTwinkle, 500);
  setInterval(spawnAmbient, 700);
  for (let i = 0; i < 10; i++) setTimeout(spawnTwinkle, i * 120);

  // ---------- Sound (synthesized on the fly, no audio files needed) ----------

  let audioCtx = null;
  let soundOn = true;

  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(ctx, freq, startTime, duration, type, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.03);
  }

  // A cheerful little ascending chime, randomized in pitch each tap so it
  // never feels repetitive.
  function playMagicSound() {
    if (!soundOn) return;
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const roots = [392.0, 440.0, 523.25, 587.33]; // G4, A4, C5, D5
    const root = choice(roots);
    const notes = [root, root * 1.25, root * 1.5]; // happy major-ish rise
    notes.forEach((freq, i) => {
      playTone(ctx, freq, now + i * 0.055, 0.24, 'triangle', 0.18);
    });
  }

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) getAudioCtx(); // unlock/resume right away on the tap that turned it on
  });

  // ---------- Tap-triggered magic ----------

  function ripple(x, y) {
    const r = document.createElement('div');
    r.className = 'tap-ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  function confettiBurst(x, y) {
    const count = 26;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle confetti';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = choice(CONFETTI_COLORS);

      const angle = rand(0, Math.PI * 2);
      const dist = rand(80, 220);
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - rand(40, 100); // biased upward
      const rot = rand(180, 720) * (Math.random() < 0.5 ? -1 : 1);
      const dur = rand(0.8, 1.4);

      document.body.appendChild(p);
      p.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 1, offset: 0.6 },
        { transform: `translate(-50%,-50%) translate(${dx * 1.15}px, ${dy + 160}px) rotate(${rot * 1.3}deg)`, opacity: 0 }
      ], { duration: dur * 1000, easing: 'cubic-bezier(.2,.7,.3,1)' });

      setTimeout(() => p.remove(), dur * 1000 + 50);
    }
  }

  function starBurst(x, y) {
    const count = 10;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle star-bit';
      p.textContent = choice(['⭐','✨','💫']);
      p.style.left = x + 'px';
      p.style.top = y + 'px';

      const angle = (Math.PI * 2 * i) / count + rand(-0.2, 0.2);
      const dist = rand(60, 140);
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const dur = rand(0.6, 0.9);

      document.body.appendChild(p);
      p.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) scale(0.4)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) scale(1.1)`, opacity: 1, offset: 0.6 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) scale(0.3)`, opacity: 0 }
      ], { duration: dur * 1000, easing: 'ease-out' });

      setTimeout(() => p.remove(), dur * 1000 + 50);
    }
  }

  function emojiPop(x, y) {
    const p = document.createElement('div');
    p.className = 'particle emoji-pop';
    p.textContent = choice(EMOJIS);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const dur = 1.1;
    const drift = rand(-40, 40);

    document.body.appendChild(p);
    p.animate([
      { transform: 'translate(-50%,-50%) translate(0,0) scale(0.3) rotate(0deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) translate(0,-10px) scale(1.3) rotate(-8deg)', opacity: 1, offset: 0.25 },
      { transform: `translate(-50%,-50%) translate(${drift}px,-120px) scale(1) rotate(8deg)`, opacity: 1, offset: 0.75 },
      { transform: `translate(-50%,-50%) translate(${drift * 1.4}px,-180px) scale(0.8) rotate(-4deg)`, opacity: 0 }
    ], { duration: dur * 1000, easing: 'ease-out' });

    setTimeout(() => p.remove(), dur * 1000 + 50);
  }

  const EFFECTS = [confettiBurst, starBurst, emojiPop];

  function magicAt(x, y) {
    ripple(x, y);
    playMagicSound();
    // fire two different effects together for extra wow-factor
    const picks = new Set();
    while (picks.size < 2) picks.add(choice(EFFECTS));
    picks.forEach(fn => fn(x, y));
  }

  document.addEventListener('pointerdown', (e) => {
    magicAt(e.clientX, e.clientY);
  });
</script>

</body>
</html>
