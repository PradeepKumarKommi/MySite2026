<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #4fd1ff, #7f5bff, #ff5da2, #ffd93d, #4fd1ff);
    background-size: 500% 500%;
    animation: candyShift 16s ease infinite;
    -webkit-user-select: none;
    user-select: none;
  }

  @keyframes candyShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .twinkle {
    position: absolute;
    color: #fff;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 0.85; transform: scale(1.15); }
  }

  .top-right-icons {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 21;
    display: flex;
    gap: 8px;
  }

  .icon-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  #nextLabel {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 21;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-weight: 800;
    font-size: clamp(0.9em, 3.6vw, 1.1em);
    padding: 10px 18px;
    border-radius: 50px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 90px 20px 20px;
    gap: 22px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5em, 7vw, 2.4em);
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffe680, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }

  .hint {
    margin: -14px 0 0;
    color: #fff;
    font-size: clamp(0.9em, 3.6vw, 1.15em);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(10px, 2.4vw, 20px);
    max-width: 560px;
    width: 100%;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); max-width: 320px; }
  }

  .num-tile {
    border: none;
    border-radius: 20px;
    aspect-ratio: 1;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.6em, 6vw, 2.4em);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(255,255,255,0.4);
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }

  .num-tile:active { transform: scale(0.9); }

  .num-tile.gone {
    animation: tileGone 0.55s ease forwards;
    pointer-events: none;
  }

  @keyframes tileGone {
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.3) rotate(-8deg); box-shadow: 0 0 0 10px rgba(107,255,140,0.4), 0 8px 20px rgba(0,0,0,0.25); }
    100% { transform: scale(0) rotate(20deg); opacity: 0; }
  }

  .num-tile.wrong {
    animation: tileWrong 0.9s ease;
  }

  @keyframes tileWrong {
    0%   { background-color: #e0334d; transform: translateX(0); }
    15%  { transform: translateX(-8px); }
    30%  { transform: translateX(8px); }
    45%  { transform: translateX(-6px); }
    60%  { transform: translateX(6px); }
    75%  { transform: translateX(0); }
    100% { background-color: inherit; }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
  }

  .confetti {
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }

  .star-bit {
    font-size: 1.6em;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  }

  #congratsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 22;
    background: radial-gradient(circle at 50% 40%, #ffd93d 0%, #ff5da2 55%, #7f5bff 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #congratsOverlay h1 {
    color: #fff;
    font-size: clamp(2em, 10vw, 3.4em);
    margin: 0 0 12px;
    -webkit-text-fill-color: #fff;
    text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: bob 1.2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  #congratsOverlay p {
    color: #fff;
    font-size: clamp(1.1em, 5vw, 1.5em);
    font-weight: 600;
    margin: 0 0 30px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  #playAgainBtn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1em, 5vw, 1.4em);
    padding: 16px 42px;
    border: none;
    border-radius: 50px;
    background: #fff;
    color: #ff4d6d;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
  }

  .rocket {
    position: fixed;
    bottom: -5%;
    font-size: 2em;
    pointer-events: none;
    z-index: 23;
    animation: launch linear forwards;
  }

  @keyframes launch {
    to { transform: translateY(-90vh); opacity: 0.2; }
  }
</style>
</head>
<body data-page="numbers">

<div class="sky" id="sky"></div>

<div class="top-right-icons">
  <button id="homeBtn" class="icon-circle" aria-label="Home">🏠</button>
</div>
<div id="nextLabel">Next: 1</div>

<div class="stage">
  <h1>🔢 Number Order! 🔢</h1>
  <p class="hint">Tap the numbers 1 to 10 in order!</p>
  <div class="grid" id="grid"></div>
</div>

<div id="congratsOverlay">
  <h1>🎉 Great Counting! 🎉</h1>
  <p>You found every number, 1 to 10! 🔢</p>
  <button id="playAgainBtn">🔁 Play Again</button>
</div>

<script src="script.js"></script>

</body>
</html>
