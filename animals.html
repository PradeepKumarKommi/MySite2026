<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #4fd1ff, #7f5bff, #ff5da2, #ffd93d, #4fd1ff);
    background-size: 500% 500%;
    animation: candyShift 16s ease infinite;
    -webkit-user-select: none;
    user-select: none;
  }

  @keyframes candyShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .twinkle {
    position: absolute;
    color: #fff;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 0.85; transform: scale(1.15); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    height: 100dvh;
  }

  .topbar {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    pointer-events: none;
  }

  .topbar h1 {
    margin: 0;
    font-size: clamp(1.1em, 5vw, 1.7em);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,0.25);
  }

  #promptLabel {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    font-size: clamp(1.3em, 6.5vw, 2.2em);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 4px 14px rgba(0,0,0,0.3);
    letter-spacing: 0.5px;
    pointer-events: none;
    padding: 0 12px;
  }

  #promptLabel.pop {
    animation: labelPop 0.4s ease;
  }

  @keyframes labelPop {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .animal-btn {
    position: absolute;
    z-index: 4;
    border: none;
    background: rgba(255,255,255,0.24);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 50%;
    width: clamp(66px, 15vw, 110px);
    height: clamp(66px, 15vw, 110px);
    font-size: clamp(2em, 8vw, 3.4em);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,0.18), inset 0 0 0 3px rgba(255,255,255,0.4);
    -webkit-tap-highlight-color: transparent;
    transform: translate(-50%, -50%);
    will-change: left, top;
  }

  .animal-btn.right {
    animation: correctPop 0.7s ease forwards;
    pointer-events: none;
  }

  @keyframes correctPop {
    0%   { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    35%  { transform: translate(-50%,-50%) scale(1.4) rotate(-10deg); box-shadow: 0 0 0 10px rgba(107,255,140,0.4), 0 8px 22px rgba(0,0,0,0.18); }
    70%  { transform: translate(-50%,-50%) scale(1.2) rotate(8deg); }
    100% { transform: translate(-50%,-50%) scale(0) rotate(20deg); opacity: 0; }
  }

  .animal-btn.wrong {
    animation: shake 0.45s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translate(-50%,-50%) rotate(0deg); }
    20%  { transform: translate(-50%,-50%) translateX(-8px) rotate(-8deg); }
    40%  { transform: translate(-50%,-50%) translateX(8px) rotate(8deg); }
    60%  { transform: translate(-50%,-50%) translateX(-6px) rotate(-6deg); }
    80%  { transform: translate(-50%,-50%) translateX(6px) rotate(6deg); }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
  }

  .confetti {
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }

  .star-bit {
    font-size: 1.6em;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  }

  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: linear-gradient(135deg, #7f5bff, #ff5da2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }

  #startOverlay h1 {
    color: #fff;
    font-size: clamp(1.8em, 8vw, 2.8em);
    margin: 0 0 10px;
    text-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  #startOverlay p {
    color: #fff;
    font-size: clamp(1em, 4vw, 1.2em);
    margin: 0 0 28px;
    opacity: 0.92;
    max-width: 460px;
  }

  #startBtn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1em, 5vw, 1.4em);
    padding: 16px 42px;
    border: none;
    border-radius: 50px;
    background: #fff;
    color: #ff4d6d;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    animation: bob 1.6s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .top-right-icons {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 21;
    display: flex;
    gap: 8px;
  }

  .icon-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  #counter {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 21;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-weight: 800;
    font-size: clamp(0.9em, 3.6vw, 1.1em);
    padding: 10px 18px;
    border-radius: 50px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  #congratsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 22;
    background: radial-gradient(circle at 50% 40%, #ffd93d 0%, #ff5da2 55%, #7f5bff 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #congratsOverlay h1 {
    color: #fff;
    font-size: clamp(2em, 10vw, 3.4em);
    margin: 0 0 12px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: bob 1.2s ease-in-out infinite;
  }

  #congratsOverlay p {
    color: #fff;
    font-size: clamp(1.1em, 5vw, 1.5em);
    font-weight: 600;
    margin: 0 0 30px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  #playAgainBtn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1em, 5vw, 1.4em);
    padding: 16px 42px;
    border: none;
    border-radius: 50px;
    background: #fff;
    color: #ff4d6d;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
  }

  .rocket {
    position: fixed;
    bottom: -5%;
    font-size: 2em;
    pointer-events: none;
    z-index: 23;
    animation: launch linear forwards;
  }

  @keyframes launch {
    to { transform: translateY(-90vh); opacity: 0.2; }
  }
</style>
</head>
<body data-page="animals">

<div class="sky" id="sky"></div>

<div class="top-right-icons">
  <button id="homeBtn" class="icon-circle" aria-label="Home">🏠</button>
  <button id="soundToggle" class="icon-circle" aria-label="Toggle sound">🔊</button>
</div>
<div id="counter">10 left</div>

<div class="topbar"><h1>🐾 Animal Friends 🐾</h1></div>

<div class="stage" id="stage">
  <div id="promptLabel"></div>
</div>

<div id="startOverlay">
  <h1>🐾 Animal Friends 🐾</h1>
  <p>10 animals are floating around the screen. Listen for the name I call out, then tap the matching animal!</p>
  <button id="startBtn">▶️ Start!</button>
</div>

<div id="congratsOverlay">
  <h1>🎉 Congratulations! 🎉</h1>
  <p>You found all 10 animals! 🐾</p>
  <button id="playAgainBtn">🔁 Play Again</button>
</div>

<script src="script.js"></script>

</body>
</html>
