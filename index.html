<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kids Fun Zone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #7f5bff, #ff5da2, #ff9a3c, #4fd1ff, #7f5bff);
    background-size: 500% 500%;
    animation: candyShift 16s ease infinite;
    -webkit-user-select: none;
    user-select: none;
  }

  @keyframes candyShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .twinkle {
    position: absolute;
    color: #fff;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 0.85; transform: scale(1.15); }
  }

  #soundToggle {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 28px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8em, 8vw, 3em);
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffe680, #fff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
    animation: bob 2.4s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-6px) rotate(1deg); }
  }

  .subtitle {
    margin: -18px 0 0;
    color: #fff;
    font-size: clamp(1em, 4vw, 1.3em);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .grid {
    display: flex;
    gap: clamp(16px, 4vw, 34px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .tile {
    border: none;
    background: rgba(255,255,255,0.92);
    border-radius: 26px;
    width: clamp(140px, 30vw, 210px);
    padding: 18px 14px 16px;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: popIn 0.5s cubic-bezier(.26,1.4,.44,1) both, floatTile 3.2s ease-in-out infinite;
    transition: transform 0.15s ease;
  }

  .tile:nth-child(1) { animation-delay: 0s, 0s; }
  .tile:nth-child(2) { animation-delay: 0.12s, 0.3s; }
  .tile:nth-child(3) { animation-delay: 0.24s, 0.6s; }
  .tile:nth-child(4) { animation-delay: 0.36s, 0.9s; }

  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  @keyframes floatTile {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .tile:active {
    transform: scale(0.92) !important;
  }

  .tile-icon {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .tile-icon.animals   { background: linear-gradient(160deg, #ffe3c2, #ffc98a); }
  .tile-icon.painting  { background: linear-gradient(160deg, #e0d4ff, #c9b3ff); }
  .tile-icon.colorbook { background: linear-gradient(160deg, #cdeeff, #a6e0ff); }
  .tile-icon.numbers   { background: linear-gradient(160deg, #d4ffe0, #a6f5c0); }

  .tile-icon svg { width: 78%; height: 78%; }

  .tile-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(0.95em, 3.6vw, 1.15em);
    color: #46567a;
  }
</style>
</head>
<body data-page="home">

<div class="sky" id="sky"></div>

<button id="soundToggle" aria-label="Toggle sound">🔊</button>

<div class="wrap">
  <h1>🌈 Kids Fun Zone 🌈</h1>
  <p class="subtitle">Pick something fun to do!</p>

  <div class="grid">
    <button class="tile" data-href="animals.html">
      <div class="tile-icon animals">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="112" r="68" fill="#f4a259"/>
          <ellipse cx="48" cy="55" rx="24" ry="36" fill="#c97b3d" transform="rotate(-25 48 55)"/>
          <ellipse cx="152" cy="55" rx="24" ry="36" fill="#c97b3d" transform="rotate(25 152 55)"/>
          <ellipse cx="100" cy="136" rx="34" ry="26" fill="#fff3e0"/>
          <circle cx="80" cy="96" r="9" fill="#3a2b22"/>
          <circle cx="120" cy="96" r="9" fill="#3a2b22"/>
          <ellipse cx="100" cy="128" rx="10" ry="7" fill="#3a2b22"/>
          <path d="M85,146 Q100,159 115,146" stroke="#3a2b22" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tile-label">🐾 Animals</div>
    </button>

    <button class="tile" data-href="painting.html">
      <div class="tile-icon painting">
        <svg viewBox="0 0 200 200">
          <path d="M100,28 C52,28 22,62 22,102 C22,136 46,148 60,148 C72,148 75,136 66,128 C57,120 61,108 76,108 L138,108 C164,108 180,88 180,66 C180,44 150,28 100,28 Z" fill="#8d5a44"/>
          <circle cx="88" cy="58" r="13" fill="#ff4d6d"/>
          <circle cx="128" cy="52" r="13" fill="#ffd93d"/>
          <circle cx="156" cy="78" r="13" fill="#4fd1ff"/>
          <circle cx="58" cy="86" r="13" fill="#6bff8c"/>
          <circle cx="148" cy="112" r="13" fill="#a55bff"/>
          <g transform="rotate(35 150 150)">
            <rect x="145" y="120" width="12" height="60" rx="5" fill="#deb887"/>
            <polygon points="139,118 163,118 151,96" fill="#5a4632"/>
          </g>
        </svg>
      </div>
      <div class="tile-label">🎨 Painting</div>
    </button>

    <button class="tile" data-href="colorbook.html">
      <div class="tile-icon colorbook">
        <svg viewBox="0 0 200 200">
          <rect x="24" y="34" width="152" height="120" rx="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="9"/>
          <circle cx="148" cy="60" r="14" fill="#ffd93d" stroke="#2b2b2b" stroke-width="5"/>
          <path d="M34,144 L74,100 L104,126 L134,86 L166,144 Z" fill="#6bff8c" stroke="#2b2b2b" stroke-width="6" stroke-linejoin="round"/>
          <g transform="rotate(20 158 168)">
            <rect x="149" y="150" width="18" height="46" rx="4" fill="#ff4d6d"/>
            <polygon points="149,150 167,150 158,132" fill="#ff9a3c"/>
          </g>
        </svg>
      </div>
      <div class="tile-label">🖼️ Paint a Picture</div>
    </button>

    <button class="tile" data-href="numbers.html">
      <div class="tile-icon numbers">
        <svg viewBox="0 0 200 200">
          <rect x="30" y="90" width="60" height="60" rx="14" fill="#4f6bff" transform="rotate(-8 60 120)"/>
          <text x="60" y="133" transform="rotate(-8 60 120)" font-family="'Baloo 2', sans-serif" font-size="42" font-weight="800" fill="#fff" text-anchor="middle">1</text>

          <rect x="80" y="58" width="60" height="60" rx="14" fill="#ff9a3c" transform="rotate(6 110 88)"/>
          <text x="110" y="101" transform="rotate(6 110 88)" font-family="'Baloo 2', sans-serif" font-size="42" font-weight="800" fill="#fff" text-anchor="middle">2</text>

          <rect x="120" y="102" width="60" height="60" rx="14" fill="#2ecf6b" transform="rotate(-4 150 132)"/>
          <text x="150" y="145" transform="rotate(-4 150 132)" font-family="'Baloo 2', sans-serif" font-size="42" font-weight="800" fill="#fff" text-anchor="middle">3</text>
        </svg>
      </div>
      <div class="tile-label">🔢 Number Order</div>
    </button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
